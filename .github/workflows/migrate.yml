# Applies pending Drizzle migrations to the production database.
# Run it by hand from GitHub → Actions → "Migrate database" → Run workflow,
# which works from a phone. Requires the DATABASE_URL repository secret
# (use Supabase's *Session pooler* string, port 5432: the transaction
# pooler does not support the DDL these migrations run).
name: Migrate database

on:
  workflow_dispatch:

concurrency: migrate-database

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
