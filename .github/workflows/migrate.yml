# Applies pending Drizzle migrations to the production database.
# Run it by hand from GitHub → Actions → "Migrate database" → Run workflow,
# which works from a phone. Requires the DATABASE_URL repository secret
# (use Supabase's *Session pooler* string, port 5432: the transaction
# pooler does not support the DDL these migrations run).
name: Migrate database

on:
  workflow_dispatch:

concurrency: migrate-database

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub substitutes an empty string for a missing secret, which
      # surfaces much later as a confusing driver error.
      - name: Check the DATABASE_URL secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL repository secret is empty or missing."
            echo "Add it under Settings → Secrets and variables → Actions → New repository secret,"
            echo "using Supabase's Session pooler connection string (port 5432)."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
