<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Flow stage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>html,body{margin:0;min-height:100%}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-sm)}#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { AuthPage, PricingPage, CheckoutSummary, PurchaseConfirmation } = window.VerbalyxDesignSystem_caebf9;
const P = new URLSearchParams(location.search);
const v = P.get('v') || 'registro';
function App(){
  if(v==='registro') return <AuthPage mode="registro"/>;
  if(v==='login') return <AuthPage mode="login" keptText={false}/>;
  if(v==='precios') return <PricingPage/>;
  if(v==='checkout') return <CheckoutSummary plan="unlimited" initialCycle="monthly"/>;
  if(v==='checkout-anual') return <CheckoutSummary plan="unlimited" initialCycle="yearly"/>;
  if(v==='confirmacion') return <PurchaseConfirmation/>;
  return null;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
