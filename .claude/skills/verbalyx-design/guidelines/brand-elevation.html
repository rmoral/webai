<!-- @dsCard group="Brand" viewport="700x140" name="Elevation" subtitle="Two shadows in the entire product — and nothing bigger" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:12px}</style></head><body><div style="display:flex;gap:18px;align-items:center;padding:8px">
<div style="width:180px;height:70px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px">--shadow-xs</div>
<div style="width:180px;height:70px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px">--shadow-sm</div>
<span style="color:var(--muted-foreground);font-size:11px;max-width:220px">xs on controls (buttons, inputs), sm on cards. No md/lg/xl, no coloured shadows, no glows.</span>
</div></body></html>
