<!-- @dsCard group="Colors" viewport="700x130" name="Borders & focus ring" subtitle="--border, --input, --ring and the 3px focus halo" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:12px}</style></head><body><div style="display:flex;gap:14px;align-items:center">
<div style="width:150px;height:70px;border:1px solid var(--border);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px">--border</div>
<div style="width:150px;height:70px;border:1px solid var(--input);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px">--input</div>
<div style="width:150px;height:70px;border:1px solid var(--ring);border-radius:var(--radius-md);box-shadow:var(--ring-focus);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px">--ring + 3px</div>
<span style="color:var(--muted-foreground);max-width:190px">Focus is always a 3px halo at 50% of <code>--ring</code> plus a ring-coloured border. Never an outline.</span>
</div></body></html>
