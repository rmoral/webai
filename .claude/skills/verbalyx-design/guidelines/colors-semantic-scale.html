<!-- @dsCard group="Colors" viewport="700x180" name="Semantic scale" subtitle="Success, warning, danger — fill, tint, border and text-safe ink" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden"><div style="height:38px;background:var(--success)"></div><div style="height:26px;background:var(--success-soft);border-top:1px solid var(--success-line)"></div><div style="padding:8px 10px"><b style="font-size:11px;color:var(--success-ink)">Success</b><p style="margin:4px 0 0;font-size:10px;color:var(--muted-foreground);line-height:1.5">Puntuación ≥ 70 · «Añadido»</p></div></div><div style="border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden"><div style="height:38px;background:var(--warning-fill)"></div><div style="height:26px;background:var(--warning-soft);border-top:1px solid var(--warning-line)"></div><div style="padding:8px 10px"><b style="font-size:11px;color:var(--warning-ink)">Warning</b><p style="margin:4px 0 0;font-size:10px;color:var(--muted-foreground);line-height:1.5">Puntuación 40-69 · «Reescrito» · cuota al 80%</p></div></div><div style="border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden"><div style="height:38px;background:var(--danger)"></div><div style="height:26px;background:var(--danger-soft);border-top:1px solid var(--danger-line)"></div><div style="padding:8px 10px"><b style="font-size:11px;color:var(--danger-ink)">Danger</b><p style="margin:4px 0 0;font-size:10px;color:var(--muted-foreground);line-height:1.5">Puntuación < 40 · cuota agotada · borrar cuenta</p></div></div>
</div></body></html>
