<!-- @dsCard group="Brand" viewport="700x140" name="Corner radii" subtitle="One --radius of 10px, four derived steps" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:12px}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end">
<div style="text-align:center"><div style="width:84px;height:60px;border:1px solid var(--border);background:var(--secondary);border-radius:6px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);margin-top:6px">--radius-sm</div><div style="font-size:10px">6px</div></div><div style="text-align:center"><div style="width:84px;height:60px;border:1px solid var(--border);background:var(--secondary);border-radius:8px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);margin-top:6px">--radius-md</div><div style="font-size:10px">8px</div></div><div style="text-align:center"><div style="width:84px;height:60px;border:1px solid var(--border);background:var(--secondary);border-radius:10px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);margin-top:6px">--radius-lg</div><div style="font-size:10px">10px</div></div><div style="text-align:center"><div style="width:84px;height:60px;border:1px solid var(--border);background:var(--secondary);border-radius:14px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);margin-top:6px">--radius-xl</div><div style="font-size:10px">14px</div></div><div style="text-align:center"><div style="width:84px;height:60px;border:1px solid var(--border);background:var(--secondary);border-radius:9999px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);margin-top:6px">--radius-full</div><div style="font-size:10px">9999px</div></div>
<span style="color:var(--muted-foreground);font-size:11px;max-width:150px">Controls use <b>md</b>, cards use <b>xl</b>. <code>full</code> is defined but unused — no pills.</span>
</div></body></html>
