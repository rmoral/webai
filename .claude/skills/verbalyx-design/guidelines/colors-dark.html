<!-- @dsCard group="Colors" viewport="700x160" name="Dark theme" subtitle="Add .dark to an ancestor; primary inverts to near-white" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:12px}</style></head><body><div class="dark" style="background:var(--background);color:var(--foreground);padding:14px;border-radius:var(--radius-md);display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="background:var(--background);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;height:36px;font-family:var(--font-mono);font-size:9px">--background</div><div style="background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;height:36px;font-family:var(--font-mono);font-size:9px">--card</div><div style="background:var(--primary);color:var(--primary-foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;height:36px;font-family:var(--font-mono);font-size:9px">--primary</div><div style="background:var(--muted);color:var(--muted-foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;height:36px;font-family:var(--font-mono);font-size:9px">--muted</div><div style="background:var(--secondary);color:var(--secondary-foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;height:36px;font-family:var(--font-mono);font-size:9px">--secondary</div><div style="background:var(--accent);color:var(--accent-foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;height:36px;font-family:var(--font-mono);font-size:9px">--accent</div><div style="background:var(--destructive);color:var(--destructive-foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;height:36px;font-family:var(--font-mono);font-size:9px">--destructive</div><div style="background:var(--border);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;height:36px;font-family:var(--font-mono);font-size:9px">--border</div>
</div></body></html>
