<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:12px}</style></head><body><div style="border:1px solid var(--border);border-radius:var(--radius-xl);padding:14px;font-size:14px;line-height:1.75">
<mark style="background:var(--hl-rewritten);box-shadow:inset 0 -2px 0 var(--hl-rewritten-line);border-radius:2px;padding:0 1px">Estas metodologías cambian bastante los resultados</mark>, y por eso vale la pena implementarlas con cuidado. <mark style="background:var(--hl-added);box-shadow:inset 0 -2px 0 var(--hl-added-line);border-radius:2px;padding:0 1px">Dicho de otro modo</mark>: el proceso llega al objetivo sin dar vueltas de más.
<div style="display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--muted-foreground)">
<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:var(--hl-rewritten);box-shadow:inset 0 -2px 0 var(--hl-rewritten-line)"></span>Reescrito</span>
<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:var(--hl-added);box-shadow:inset 0 -2px 0 var(--hl-added-line)"></span>Añadido</span>
<span>Tinte + subrayado de 2px, nunca texto de color: el resultado se copia.</span>
</div></div></body></html>
